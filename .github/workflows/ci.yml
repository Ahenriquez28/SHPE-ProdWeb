# CI pipeline — runs on every PR targeting main and every push to main.
#
# Current coverage: .NET API build only.
# Tests will be added in Phase 1 once test projects exist.
# Web job will be added after Phase 0.5 (frontend scaffold).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  api:
    name: API — restore & build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: apps/api
        run: dotnet restore

      - name: Build
        working-directory: apps/api
        run: dotnet build --no-restore --configuration Release

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Static assets (JS chunks, CSS, images, fonts) — cache aggressively.
    # Vite fingerprints filenames with content hashes so "immutable" is safe:
    # a changed file gets a new hash → new URL → cache miss → fresh download.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other paths → index.html so React Router handles client-side routing.
    # Without this, a hard refresh on /dashboard/profile returns a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

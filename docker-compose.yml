services:
  # Postgres database
  # Runs locally in Docker so no one needs to install Postgres manually
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shpe_dev
    ports:
      # Expose port 5432 so we can connect from the API and from psql
      - "5432:5432"
    volumes:
      # Persist data between docker compose down/up cycles
      - postgres_data:/var/lib/postgresql/data

  # .NET API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      # Use the "base" stage (SDK + dotnet-ef) for local dev.
      # App Platform builds all the way to "final" (aspnet runtime, no SDK).
      target: base
    restart: unless-stopped
    environment:
      # Tell .NET we're in development mode
      ASPNETCORE_ENVIRONMENT: Development
      # Override the connection string to point to the postgres service above
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=shpe_dev;Username=postgres;Password=postgres
    ports:
      # API available at localhost:5000
      - "5001:8080"
    depends_on:
      # Don't start the API until Postgres is running
      - postgres
    volumes:
      # Mount source code for hot reload with dotnet watch
      - ./apps/api:/app
    working_dir: /app
    command: dotnet watch run --no-launch-profile

  # React frontend — built with Vite, served by nginx on port 80.
  #
  # WHY BUILD ARGS FOR VITE_*:
  #   Vite embeds environment variables into the JS bundle at build time.
  #   They are NOT injectable at runtime the way Docker env vars normally work.
  #   Changing VITE_API_URL requires a rebuild: docker compose up -d --build web
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        # API URL baked into the frontend bundle — points at the staging API.
        VITE_API_URL: http://167.99.145.129:5001
        # Clerk publishable key — safe to commit, it's a public key by design.
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_dW5pZmllZC1waG9lbml4LTU0LmNsZXJrLmFjY291bnRzLmRldiQ
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  # Named volume so Postgres data survives container restarts
  postgres_data: